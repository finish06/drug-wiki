site_name: Drug API Wiki
site_description: Developer docs for the drug-gate API — drug names, NDCs, classes, labels, interactions and RxNorm.
site_url: https://wiki.drugs.calebdunn.tech/
repo_url: https://github.com/finish06/drug-wiki
repo_name: drug-wiki
edit_uri: edit/main/wiki/
docs_dir: wiki
copyright: Data from FDA DailyMed, openFDA and NLM RxNorm. Not medical advice.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/git-alt

plugins:
  - search
  - macros:
      on_undefined: strict

# Interactive API page: vendored swagger-ui-dist (scripts/vendor-swagger-ui.sh).
extra_css:
  - assets/swagger-ui/swagger-ui.css
extra_javascript:
  - assets/swagger-ui/swagger-ui-bundle.js
  - assets/javascripts/swagger-init.js

extra:
  # The one place the API's address lives. Pages use {{ api_base }}.
  api_base: https://drug-gate.calebdunn.tech
  key_request_url: https://github.com/finish06/drug-gate/issues/new?title=API%20key%20request

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Get started:
      - Start here: index.md
      - Get an API key: get-started/api-keys.md
      - Quickstart: get-started/quickstart.md
      - How it works: get-started/concepts.md
  - Guides:
      - Look up a drug by NDC: guides/ndc-lookup.md
      - Build a drug search box: guides/search-box.md
      - Show a drug info card: guides/drug-info.md
      - Check drug interactions: guides/interactions.md
      - Browse by drug class: guides/drug-classes.md
      - Normalize names with RxNorm: guides/rxnorm.md
      - Read product labels (SPL): guides/product-labels.md
  - Reference:
      - All endpoints: reference/endpoints.md
      - Errors and rate limits: reference/errors.md
      - Interactive API (OpenAPI): reference/api.md
      - Glossary: reference/glossary.md
  - System:
      - How the system fits together: system/index.md
      - drug-gate (public API): system/drug-gate.md
      - cash-drugs (caching proxy): system/cash-drugs.md
      - rx-dag (NDC database): system/rx-dag.md
      - Data freshness: system/data-freshness.md
      - Reliability: system/reliability.md
  - Help:
      - FAQ and troubleshooting: help/faq.md
      - Improve this wiki: help/contributing.md
